name: design_system
description: TankerTrack design tokens, themes and shared TT* components. Single source of truth for all styling (see docs/plan/08-ui-centralization.md).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0

dev_dependencies:
  custom_lint: ^0.7.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  tankertrack_lints:
    path: ../../tool/tankertrack_lints

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/illustrations/

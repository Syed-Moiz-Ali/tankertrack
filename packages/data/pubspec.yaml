name: data
description: TankerTrack data layer (repository interfaces, MockDataSource seeds, TrackingStream simulator). UI never touches data sources directly.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  core:
    path: ../core
  domain:
    path: ../domain
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

dev_dependencies:
  build_runner: ^2.4.9
  custom_lint: ^0.7.0
  flutter_lints: ^5.0.0
  freezed: ^3.1.0
  lints: ^5.0.0
  tankertrack_lints:
    path: ../../tool/tankertrack_lints
  test: ^1.26.0

flutter:
  assets:
    - assets/seeds/

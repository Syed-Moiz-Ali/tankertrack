name: fleet_ui
description: TankerTrack fleet widgets (domain-to-design mappings, trip cards, map widgets). Screens compose these; styling stays in design_system.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  core:
    path: ../core
  design_system:
    path: ../design_system
  domain:
    path: ../domain
  flutter:
    sdk: flutter

dev_dependencies:
  custom_lint: ^0.7.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  tankertrack_lints:
    path: ../../tool/tankertrack_lints

flutter:
  uses-material-design: true

name: fleet_ui
description: TankerTrack fleet widgets (domain-to-design mappings, trip cards, map widgets). Screens compose these; styling stays in design_system.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  core:
    path: ../core
  data:
    path: ../data
  design_system:
    path: ../design_system
  domain:
    path: ../domain
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  l10n:
    path: ../l10n

dev_dependencies:
  build_runner: ^2.4.9
  custom_lint: ^0.7.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.1.0
  tankertrack_lints:
    path: ../../tool/tankertrack_lints

flutter:
  uses-material-design: true

name: back_office_web
description: TankerTrack Back Office web portal (includes /control-room in P7).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  design_system:
    path: ../../packages/design_system
  domain:
    path: ../../packages/domain
  fleet_ui:
    path: ../../packages/fleet_ui
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.0
  flutter_svg: ^2.0.0
  go_router: ^15.0.0
  l10n:
    path: ../../packages/l10n
  shared_preferences: ^2.5.0

dev_dependencies:
  custom_lint: ^0.7.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  tankertrack_lints:
    path: ../../tool/tankertrack_lints

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: fonts/PlusJakartaSans-Variable.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-Variable.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: fonts/PlusJakartaSans-Variable.ttf
          weight: 800
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Noto Sans Arabic
      fonts:
        - asset: fonts/NotoSansArabic-Variable.ttf
